services:
  # ─────────────────────────────────────────
  # 1. DATABASE — PostgreSQL 15
  # ─────────────────────────────────────────
  db:
    image: postgres:15-alpine
    container_name: katalog_db
    restart: unless-stopped
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      POSTGRES_DB: ${DB_NAME:-katalog_pakaian}
      POSTGRES_USER: ${DB_USER:-katalog_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-katalog_secret_2024}
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-katalog_user} -d ${DB_NAME:-katalog_pakaian}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─────────────────────────────────────────
  # 2. BACKEND — Django + DRF
  # ─────────────────────────────────────────
  backend:
    build:
      context: ./catalog_backend
      dockerfile: Dockerfile
    container_name: katalog_backend
    restart: unless-stopped
    volumes:
      - ./catalog_backend:/app
      - media_files:/app/media
    environment:
      DEBUG: ${DEBUG:-True}
      SECRET_KEY: ${SECRET_KEY:-django-insecure-dev-key-please-change-in-production}
      DB_NAME: ${DB_NAME:-katalog_pakaian}
      DB_USER: ${DB_USER:-katalog_user}
      DB_PASSWORD: ${DB_PASSWORD:-katalog_secret_2024}
      DB_HOST: db
      DB_PORT: 5432
      ALLOWED_HOSTS: "localhost,127.0.0.1,backend"
      CORS_ALLOWED_ORIGINS: "http://localhost:3000,http://frontend:3000"
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    command: >
      sh -c "python manage.py migrate --noinput &&
             python manage.py collectstatic --noinput &&
             python manage.py runserver 0.0.0.0:8000"

  # ─────────────────────────────────────────
  # 3. FRONTEND — Next.js
  # ─────────────────────────────────────────
  frontend:
    build:
      context: ./catalog_frontend
      dockerfile: Dockerfile
    container_name: katalog_frontend
    restart: unless-stopped
    volumes:
      - ./catalog_frontend:/app
      - /app/node_modules
      - /app/.next
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
      NEXT_PUBLIC_WHATSAPP_NUMBER: ${NEXT_PUBLIC_WHATSAPP_NUMBER:-628123456789}
    ports:
      - "3000:3000"
    depends_on:
      - backend
    command: npm run dev

  # ─────────────────────────────────────────
  # 4. NGINX — Reverse Proxy (Satpam Penunjuk Arah)
  # ─────────────────────────────────────────
  nginx:
    image: nginx:alpine
    container_name: katalog_nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - frontend
      - backend

volumes:
  postgres_data:
    driver: local
  media_files:
    driver: local
